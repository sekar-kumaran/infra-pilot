<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfraPilot — Unified DevOps &amp; SRE Control Plane v2.4</title>
  <style>
    /* ==========================================================================
       1. THEME VARIABLES (DARK MODE & LIGHT MODE)
       ========================================================================== */
    :root[data-theme="dark"] {
      --bg-app: #0b0f19;
      --bg-sidebar: #111827;
      --bg-card: #151e30;
      --bg-card-hover: #1b273d;
      --bg-elevated: #1e293b;
      --bg-input: #0f172a;
      --bg-terminal: #070b14;
      --border: #24324a;
      --border-strong: #334155;
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --accent: #06b6d4;
      --accent-soft: rgba(6, 182, 212, 0.15);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);
      --purple: #8b5cf6;
      --purple-soft: rgba(139, 92, 246, 0.16);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.28);
      --shadow-hover: 0 8px 28px rgba(0, 0, 0, 0.4);
    }

    :root[data-theme="light"] {
      --bg-app: #f1f5f9;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --bg-elevated: #f1f5f9;
      --bg-input: #ffffff;
      --bg-terminal: #0f172a;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --accent: #0891b2;
      --accent-soft: rgba(8, 145, 178, 0.1);
      --success: #059669;
      --success-soft: rgba(5, 150, 105, 0.12);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, 0.12);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.12);
      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.12);
      --shadow-card: 0 2px 10px rgba(15, 23, 42, 0.06);
      --shadow-hover: 0 10px 24px rgba(15, 23, 42, 0.11);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-app);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    /* ==========================================================================
       2. ANIMATIONS & MICRO-INTERACTIONS
       ========================================================================== */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseRingGreen {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes pulseRingRed {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.65); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .animate-view {
      animation: fadeSlideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ==========================================================================
       3. APP SHELL & RESPONSIVE TABLET/MOBILE LAYOUT
       ========================================================================== */
    .layout-root {
      display: grid;
      grid-template-columns: 264px 1fr;
      grid-template-rows: 64px 1fr;
      grid-template-areas:
        "sidebar header"
        "sidebar main";
      height: 100vh;
      width: 100vw;
    }

    .mobile-menu-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-size: 18px;
      cursor: pointer;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 35;
    }

    /* Sidebar Navigation */
    .sidebar {
      grid-area: sidebar;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 12px;
      z-index: 40;
      transition: transform 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
      overflow-y: auto;
    }

    .brand-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .brand-title {
      font-weight: 800;
      font-size: 16.5px;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-section-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 10px 10px 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8.5px 11px;
      margin-bottom: 3px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.16s ease;
    }

    .nav-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-main);
      transform: translateX(2px);
    }

    .nav-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: rgba(59, 130, 246, 0.3);
      font-weight: 600;
    }

    .nav-btn-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .nav-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1.5px 7px;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .nav-pill.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .nav-pill.super {
      background: var(--purple-soft);
      color: var(--purple);
    }

    /* Connected App Widget in Sidebar Footer (With Green/Red Status Dot!) */
    .connected-app-widget {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      font-size: 12px;
    }

    .status-dot-green {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      animation: pulseRingGreen 2s infinite;
    }

    .status-dot-red {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      animation: pulseRingRed 1.5s infinite;
    }

    /* Top Header */
    .top-header {
      grid-area: header;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
      overflow-x: auto;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .page-heading {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .cluster-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .cluster-status-pill.degraded {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    /* Main Content Scroll Area */
    .main-scroll {
      grid-area: main;
      overflow-y: auto;
      padding: 20px 24px 100px;
    }

    /* ==========================================================================
       4. CARDS, GRIDS, RESPONSIVE FORMS, BUTTONS & TABLES
       ========================================================================== */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 18px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    .card.interactive:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 800;
      color: var(--text-main);
      margin: 6px 0 4px;
      letter-spacing: -0.02em;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--primary);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .btn-success {
      background: var(--success-soft);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--success);
    }
    .btn-success:hover {
      background: var(--success);
      color: #ffffff;
    }

    .btn-warning {
      background: var(--warning-soft);
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--warning);
    }
    .btn-warning:hover {
      background: var(--warning);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--danger-soft);
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--danger);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-purple {
      background: var(--purple-soft);
      border-color: rgba(139, 92, 246, 0.4);
      color: var(--purple);
    }
    .btn-purple:hover {
      background: var(--purple);
      color: #ffffff;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); }
    .badge-danger  { background: var(--danger-soft);  color: var(--danger); }
    .badge-info    { background: var(--primary-soft); color: var(--primary); }
    .badge-purple  { background: var(--purple-soft);  color: var(--purple); }

    /* Inputs */
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .input, .select {
      width: 100%;
      padding: 8.5px 11px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-input);
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .input:focus, .select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table.clean-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table.clean-table th {
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      white-space: nowrap;
    }

    table.clean-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      vertical-align: middle;
    }

    table.clean-table tr:hover td {
      background: var(--bg-card-hover);
    }

    /* Progress Bars */
    .progress-track {
      width: 100%;
      height: 7px;
      background: var(--bg-elevated);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.35s ease;
    }

    /* Toggle Switch */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      background: var(--bg-card-hover);
    }

    .toggle-btn {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: var(--border-strong);
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .toggle-btn.on {
      background: var(--success);
    }

    .toggle-btn::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s ease;
    }

    .toggle-btn.on::after {
      transform: translateX(20px);
    }

    /* Permission Checkboxes */
    .perm-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      margin: 2px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .perm-chip.granted {
      background: var(--success-soft);
      border-color: rgba(16, 185, 129, 0.45);
      color: var(--success);
    }

    /* ==========================================================================
       5. AUTO-OPENING BOTTOM CLI & EXECUTION LOGS DRAWER
       ========================================================================== */
    .console-drawer {
      position: fixed;
      left: 264px;
      right: 0;
      bottom: 0;
      background: var(--bg-terminal);
      color: #f8fafc;
      border-top: 2px solid var(--primary);
      z-index: 50;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.45);
      transition: height 0.28s cubic-bezier(0.16, 1, 0.3, 1), left 0.25s ease;
      display: flex;
      flex-direction: column;
      height: 44px;
    }

    .console-drawer.open {
      height: 340px;
    }

    .drawer-bar {
      height: 44px;
      min-height: 44px;
      padding: 0 16px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      overflow-x: auto;
    }

    .drawer-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .drawer-tab {
      padding: 5px 11px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .drawer-tab.active {
      background: rgba(59, 130, 246, 0.22);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.45);
    }

    .drawer-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px 16px;
    }

    .terminal-output {
      flex: 1;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.55;
      color: #e2e8f0;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }

    .terminal-input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 12px;
    }

    .terminal-prompt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: #22d3ee;
      font-weight: 700;
      white-space: nowrap;
    }

    .terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
    }

    /* Toast Notification */
    #toast-stack {
      position: fixed;
      top: 72px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 370px;
    }

    .toast {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--primary);
      border-left: 4px solid var(--primary);
      padding: 11px 15px;
      border-radius: 10px;
      box-shadow: var(--shadow-hover);
      font-size: 12.5px;
      font-weight: 500;
      animation: fadeSlideUp 0.22s ease forwards;
    }

    /* ==========================================================================
       6. TABLET & MOBILE RESPONSIVE BREAKPOINTS (Fixes All Mobile/Tab Flaws!)
       ========================================================================== */
    @media (max-width: 1024px) {
      .layout-root {
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "main";
      }

      .mobile-menu-btn {
        display: inline-flex;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 270px;
        transform: translateX(-100%);
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
      }

      .sidebar.mobile-open {
        transform: translateX(0);
      }

      .sidebar-backdrop.mobile-open {
        display: block;
      }

      .console-drawer {
        left: 0;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .main-scroll {
        padding: 14px 14px 96px;
      }

      .top-header {
        padding: 0 12px;
      }

      .cluster-status-pill {
        display: none;
      }

      .grid-3, .grid-4, .form-grid {
        grid-template-columns: 1fr;
      }

      .console-drawer.open {
        height: 62vh;
      }
    }
  </style>
</head>
<body>
  <!-- Backdrop for Tablet/Mobile Slide-Over Sidebar -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleMobileSidebar(false)"></div>

  <div class="layout-root">
    <!-- ========================================================================
         LEFT SIDEBAR NAVIGATION
         ======================================================================== -->
    <aside id="app-sidebar" class="sidebar">
      <div>
        <div class="brand-box">
          <div class="brand-left">
            <div class="brand-icon">IP</div>

    // ============================================================================
    // CORE UTILITIES, AUTO-OPENING CLI HELPER & THEME / ROLE SWITCHERS
    // ============================================================================
    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour12: false });
    }

    function showToast(msg, color = 'var(--primary)') {
      const stack = document.getElementById('toast-stack');
      const item = document.createElement('div');
      item.className = 'toast';
      item.style.borderColor = color;
      item.style.borderLeftColor = color;
      item.textContent = msg;
      stack.appendChild(item);
      setTimeout(() => {
        if (item.parentNode) item.parentNode.removeChild(item);
      }, 3600);
    }

    function toggleMobileSidebar(forceOpen = null) {
      const sb = document.getElementById('app-sidebar');
      const bd = document.getElementById('sidebar-backdrop');
      const isOpen = forceOpen !== null ? forceOpen : !sb.classList.contains('mobile-open');
      sb.classList.toggle('mobile-open', isOpen);
      bd.classList.toggle('mobile-open', isOpen);
    }

    function toggleThemeMode() {
      STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', STATE.theme);
      const btn = document.getElementById('theme-toggle-btn');
      btn.textContent = STATE.theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
      showToast(`Switched to ${STATE.theme === 'light' ? 'Light' : 'Dark'} Mode`);
    }

    function switchUserRole(newRole) {
      STATE.currentRole = newRole;
      const roleSelect = document.getElementById('role-select');
      if (roleSelect && roleSelect.value !== newRole) roleSelect.value = newRole;
      showToast(`Switched active role to ${newRole}`, 'var(--purple)');
      renderCurrentPage();
    }

    function toggleDemoAppConnection() {
      STATE.demoApp.connected = !STATE.demoApp.connected;
      const sdkTool = STATE.tools.find(t => t.id === 'int-nexus-sdk');
      if (sdkTool) sdkTool.status = STATE.demoApp.connected ? 'CONNECTED' : 'DISCONNECTED';

      syncNavigationBadges();
      autoOpenCliForTask(
        'int-nexus-sdk',
        STATE.demoApp.connected ? 'infrapilot tools connect "NexusPay App SDK Agent" --endpoint http://127.0.0.1:5055' : 'infrapilot tools disconnect int-nexus-sdk',

          ? ['[SDK Handshake] Connected to NexusPay Order & Payment Gateway (http://127.0.0.1:5055)', '[SDK Hooks] Registered 5 remediation actions: app_health_check, app_restart_workers, app_flush_cache, app_scale_replicas, app_rollback_release', 'Status: ● CONNECTED (Green)']
          : ['[SDK Disconnect] Closed control-plane session with http://127.0.0.1:5055', 'Status: ● DISCONNECTED (Red)'],
        STATE.demoApp.connected ? 'Reconnected NexusPay App SDK Agent' : 'Disconnected NexusPay App SDK Agent'
      );
      renderCurrentPage();

    // CENTRAL AUTO-OPENING CLI & LOG STREAMING ENGINE
    function autoOpenCliForTask(targetId, commandStr, outputLines, logSummary, tab = 'shell') {
      if (targetId) STATE.selectedTargetId = targetId;
      const ts = timeNow();
      if (!STATE.logsByTarget[STATE.selectedTargetId]) {
        STATE.logsByTarget[STATE.selectedTargetId] = [];
      }
      STATE.logsByTarget[STATE.selectedTargetId].push({
        ts,
        level: 'INFO',
        src: 'control.plane',
        msg: logSummary || commandStr
      });
      for (const line of outputLines) {
        STATE.logsByTarget[STATE.selectedTargetId].push({
          ts,
          level: line.includes('ERROR') || line.includes('CRITICAL') ? 'ERROR' : 'INFO',
          src: 'exec.stream',
          msg: line
        });
      }

      const block = `[${ts}] $ ${commandStr}\n${outputLines.join('\n')}`;
      STATE.shellHistory.push(block);
      STATE.cliHistory.push(block);

      STATE.drawerTab = tab;
      ['shell', 'logs', 'cli'].forEach(t => {
        const btn = document.getElementById(`dtab-${t}`);
        if (btn) btn.classList.toggle('active', t === tab);
      });

      toggleDrawer(true);
      syncNavigationBadges();
      renderDrawerOutput();
    }

      STATE.selectedTargetId = targetId;
      STATE.drawerTab = 'logs';
      ['shell', 'logs', 'cli'].forEach(t => {

        if (btn) btn.classList.toggle('active', t === 'logs');
      });
      toggleDrawer(true);
      syncNavigationBadges();
      renderDrawerOutput();
      showToast(`Streaming live logs for ${targetId}`);
    }

      document.getElementById('pill-workloads').textContent = String(STATE.workloads.length);

      document.getElementById('pill-jenkins').textContent = String(STATE.jenkinsPipelines.length);

      const openInc = STATE.incidents.filter(i => i.status !== 'RESOLVED').length;
      const incPill = document.getElementById('pill-incidents');
      incPill.textContent = String(openInc);
      incPill.className = openInc > 0 ? 'nav-pill danger' : 'nav-pill';

      // Connected App Sidebar Widget Green / Red Dot
      const appDot = document.getElementById('sidebar-app-dot');
      const appTxt = document.getElementById('sidebar-app-status-text');
      const appBtn = document.getElementById('demo-conn-toggle-btn');
      if (STATE.demoApp.connected) {
        appDot.className = 'status-dot-green';

        appTxt.style.color = 'var(--success)';
        appBtn.textContent = 'Disconnect';
      } else {
        appDot.className = 'status-dot-red';
        appTxt.textContent = 'Not Connected (:5055)';
        appTxt.style.color = 'var(--danger)';
        appBtn.textContent = 'Connect';
      }

      // Header Cluster Pill
      const badge = document.getElementById('header-cluster-badge');
      const dot = document.getElementById('header-pulse-dot');
      const txt = document.getElementById('header-cluster-text');
      if (STATE.demoApp.status === 'HEALTHY' && openInc === 0 && STATE.demoApp.connected) {
        badge.className = 'cluster-status-pill';
        dot.className = 'status-dot-green';
        txt.textContent = `All ${STATE.tools.length} DevOps Tools Connected`;
      } else {
        badge.className = 'cluster-status-pill degraded';
        dot.className = 'status-dot-red';
        txt.textContent = !STATE.demoApp.connected ? 'Demo App Disconnected' : `${openInc} Active Incident(s) — Attention Required`;
      }

      const sel = document.getElementById('drawer-target-select');
      if (sel) {
        sel.innerHTML = [
          `<optgroup label="Containers &amp; Workloads">`,
          ...STATE.workloads.map(w => `<option value="${w.id}" ${w.id === STATE.selectedTargetId ? 'selected' : ''}>📦 ${escapeHtml(w.name)} (${w.id})</option>`),
          `</optgroup><optgroup label="Connected DevOps Tools">`,
          ...STATE.tools.map(t => `<option value="${t.id}" ${t.id === STATE.selectedTargetId ? 'selected' : ''}>🔌 ${escapeHtml(t.name)} (${t.id})</option>`),
          `</optgroup>`
        ].join('');
      }
      const w = STATE.workloads.find(x => x.id === STATE.selectedTargetId);
      const t = STATE.tools.find(x => x.id === STATE.selectedTargetId);
      const tName = w ? w.name : (t ? t.name : STATE.selectedTargetId);
      document.getElementById('drawer-target-name').textContent = tName;
      document.getElementById('drawer-prompt').textContent =
        STATE.drawerTab === 'cli'
          ? 'infrapilot$'
          : (STATE.shellType === 'pwsh' ? `PS /app/${tName}>` : (STATE.shellType === 'cmd' ? `C:\\${tName}>` : `root@${tName}:/app#`));
    }

      if (!STATE.logsByTarget[targetId]) STATE.logsByTarget[targetId] = [];

    function executeShellCommand(targetId, rawCmd) {
      const cmd = (rawCmd || '').trim();
      if (!cmd) return;
      const w = STATE.workloads.find(x => x.id === targetId) || STATE.workloads[0];
      const low = cmd.toLowerCase();
      let lines = [];

      if (low === 'ps aux' || low === 'get-process') {
        lines = [
          'USER       PID %CPU %MEM    VSZ   RSS STAT START   TIME COMMAND',
          'root         1  0.3  0.8  24812  8420 Ss   Nov01   2:14 /sbin/tini -- /entrypoint.sh',
          `appuser     42 ${w.cpu.toFixed(1)} 18.4 894210 ${w.memMb * 1024} Sl   Nov01  84:19 python3 -m gunicorn app:app --workers 4 --bind 0.0.0.0:5055`,
          'appuser     89  0.2  1.1  98104 12400 S    Nov01   4:02 /usr/local/bin/infrapilot-agent'
        ];
      } else if (low === 'env' || low === 'printenv') {
        lines = [
          `SERVICE_NAME=${w.name}`,
          `PROVIDER=${w.provider}`,
          `IMAGE=${w.image}`,
          `PORTS=${w.ports}`,
          `INFRAPILOT_SDK=connected`
        ];
      } else if (low.startsWith('netstat') || low.startsWith('ss ')) {
        lines = [
          'Proto Local Address      Foreign Address    State       PID/Program',
          `tcp   0.0.0.0:5055       0.0.0.0:*          LISTEN      42/gunicorn (${w.name})`,
          'tcp   0.0.0.0:9102       0.0.0.0:*          LISTEN      89/infrapilot-agent'
        ];
      } else if (low.includes('df -h') || low.includes('free -m')) {
        lines = [
          'Filesystem      Size  Used Avail Use% Mounted on',
          'overlay          80G   28G   52G  35% /',
          `Memory: ${w.memMb} MB used / ${w.memLimitMb} MB limit`
        ];
      } else if (low.includes('redis-cli flushall')) {
        STATE.demoApp.redisMemMb = 114.0;
        const r = STATE.workloads.find(x => x.id === 'res-nexus-redis');
        if (r) { r.memMb = 114; r.status = 'RUNNING'; }
        lines = ['OK — Flushed stale session keys (Redis memory dropped to 114 MB).'];
      } else if (low.includes('supervisorctl restart') || low === 'restart') {
        w.cpu = 16.4;
        w.status = 'RUNNING';
        STATE.demoApp.workerCpu = 16.4;
        STATE.demoApp.status = 'HEALTHY';
        lines = [`${w.name}: stopped`, `${w.name}: started (pid 412, CPU normalized to 16.4%)`];
      } else if (low.startsWith('infrapilot')) {
        runCliCommand(cmd);
        return;
      } else {
        lines = [`[${STATE.shellType}] Executed on ${w.name}: "${cmd}" -> exit_code=0`];
      }

      autoOpenCliForTask(targetId, cmd, lines, `Executed "${cmd}" in ${w.name}`, 'shell');
      if (STATE.currentPage === 'console' || STATE.currentPage === 'workloads') renderCurrentPage();
    }

    function runCliCommand(rawCmd) {
      const cmd = (rawCmd || '').trim();
      if (!cmd) return;
      let lines = [];
      if (cmd.includes('status')) {
        lines = [
          '╭──────────────────────────── InfraPilot Telemetry ────────────────────────────╮',
          `│ ● CONTROL PLANE ONLINE  |  Tools Connected: ${STATE.tools.length}  |  Workloads: ${STATE.workloads.length}               │`,
          `│ Active Role: ${STATE.currentRole.padEnd(12)} |  Open Incidents: ${STATE.incidents.filter(i => i.status !== 'RESOLVED').length}  |  Copilot Seats: ${STATE.copilot.activeSeats}/${STATE.copilot.totalSeats}    │`,
          '╰──────────────────────────────────────────────────────────────────────────────╯'
        ];
      } else if (cmd.includes('tools connect')) {
        lines = [
          '✔ Connected New Tool Endpoint via InfraPilot CLI',
          '  Handshake verified -> HTTP 200 OK (circuit_state=CLOSED)'
        ];
      } else if (cmd.includes('tools')) {
        lines = STATE.tools.map(t => `${t.id.padEnd(16)} ${t.name.padEnd(32)} ${t.provider.padEnd(14)} ${t.endpoint}`);
      } else if (cmd.includes('jenkins')) {
        lines = STATE.jenkinsPipelines.map(p => `${p.name.padEnd(32)} branch=${p.branch.padEnd(12)} #${p.lastBuild} [${p.status}]`);
      } else if (cmd.includes('terraform')) {
        lines = [
          'Terraform v1.8.4 — Running Workspace Plan on prod-aws-us-east-1...',
          '  + aws_cloudwatch_metric_alarm.nexuspay_p99_slo (create)',
          '  ~ aws_autoscaling_group.prod_workers (desired_capacity: 3 -> 4)',
          'Plan: 1 to add, 1 to change, 0 to destroy.'
        ];
      } else if (cmd.includes('prometheus')) {
        lines = STATE.promQueryLast.results;
      } else if (cmd.includes('grafana')) {
        lines = STATE.grafanaDashboards.map(d => `${d.uid.padEnd(18)} | ${d.title.padEnd(46)} | ${d.url}`);
      } else if (cmd.includes('users')) {
        lines = STATE.rbacUsers.map(u => `${u.email.padEnd(28)} Role=${u.role.padEnd(12)} Permissions=${u.permissions.join(',')}`);
      } else if (cmd.includes('logs')) {
        const logs = STATE.logsByTarget[STATE.selectedTargetId] || [];
        lines = logs.map(l => `${l.ts} [${l.level}] [${l.src}] ${l.msg}`);
      } else {
        lines = [`Executed CLI command: ${cmd} -> exit_code=0`];
      }
      autoOpenCliForTask(STATE.selectedTargetId, cmd, lines, `CLI executed: ${cmd}`, 'cli');
      if (STATE.currentPage === 'console') renderCurrentPage();
    }

    function runDrawerCommand() {
      const inp = document.getElementById('drawer-input');
      const val = inp.value.trim();
      if (!val) return;
      inp.value = '';
      if (STATE.drawerTab === 'cli' || val.startsWith('infrapilot')) {
        runCliCommand(val);
      } else {
        executeShellCommand(STATE.selectedTargetId, val);
      }
    }

    function renderDrawerOutput() {
      const box = document.getElementById('drawer-output');
      if (!box) return;
      if (STATE.drawerTab === 'shell') {

    function controlContainer(id, action) {
      const w = STATE.workloads.find(x => x.id === id);
      if (!w) return;
      let cmd = '';
      let out = [];
      if (action === 'restart') {
        w.status = 'RUNNING';
        w.cpu = 15.2;
        cmd = `infrapilot resources action ${w.id} restart`;
        out = [
          `[Docker/K8s Engine] Sending SIGTERM to container ${w.name} (${w.id})...`,
          `[Docker/K8s Engine] Container stopped gracefully in 1.2s.`,
          `[Docker/K8s Engine] Started new container instance -> status=RUNNING, CPU=15.2%`,
          `✔ Health check GET /health passed (HTTP 200 OK)`
        ];
        showToast(`Restarted ${w.name}`, 'var(--success)');
      } else if (action === 'toggle') {
        w.status = w.status === 'STOPPED' ? 'RUNNING' : 'STOPPED';
        w.cpu = w.status === 'STOPPED' ? 0 : 14.5;
        cmd = `infrapilot resources action ${w.id} ${w.status === 'STOPPED' ? 'stop' : 'start'}`;
        out = [
          `[Runtime Control] State transition for ${w.name}: -> ${w.status}`,
          `✔ Cgroup v2 resource state updated.`
        ];
        showToast(`${w.name} is now ${w.status}`, 'var(--warning)');
      } else if (action === 'scale') {
        w.replicas = w.replicas === '3/3' ? '5/5' : '3/3';
        cmd = `infrapilot resources action ${w.id} scale --replicas ${w.replicas.split('/')[0]}`;
        out = [
          `[Kubernetes Horizontal Scaler] Patching deployment ${w.name} replicas -> ${w.replicas}...`,
          `[Kubernetes Rollout] Waiting for new pods to pass readiness probes...`,
          `✔ Scaled ${w.name} to ${w.replicas} ready replicas.`
        ];
        showToast(`Scaled ${w.name} to ${w.replicas}`, 'var(--primary)');
      }
      autoOpenCliForTask(w.id, cmd, out, `Container action ${action} on ${w.name}`, 'shell');
      renderCurrentPage();
    }

            ? ['docker_exec', 'k8s_scale', 'jenkins_admin', 'ansible_run', 'terraform_apply', 'grafana_edit']
            : ['docker_exec', 'jenkins_admin', 'grafana_edit']);

      STATE.rbacUsers.push({
        id: `usr-${Date.now().toString().slice(-3)}`,
        name,
        email,
        role,
        title,
        permissions: defaultPerms
      });

      autoOpenCliForTask(
        'int-k8s-01',
        `infrapilot users grant "${email}" --role ${role} --permissions "${defaultPerms.join(',')}"`,
        [
          `[Super Admin RBAC] Created user account ${name} <${email}> with role=${role}`,

    // INCIDENTS & CHAOS
    function createCustomIncident() {
      const title = document.getElementById('new-inc-title').value.trim();
      const severity = document.getElementById('new-inc-severity').value;
      const targetId = document.getElementById('new-inc-target').value;
      const summary = document.getElementById('new-inc-summary').value.trim() || 'Anomaly reported by operator for investigation.';
      if (!title) {
        showToast('Please enter an Incident Title.', 'var(--warning)');
        return;
      }
      const w = STATE.workloads.find(x => x.id === targetId);
      const incId = `INC-${Math.floor(1050 + Math.random() * 8900)}`;
      STATE.incidents.unshift({
        id: incId,
        title,
        severity,
        status: 'OPEN',
        targetId,
        service: w ? w.name : targetId,
        summary,
        createdAt: 'Just now'
      });
      if (w && severity === 'CRITICAL') w.status = 'DEGRADED';
      autoOpenCliForTask(
        targetId,
        `infrapilot incidents create "${title}" --severity ${severity} --target ${targetId}`,
        [
          `[Alertmanager] Created incident ${incId} (${severity}) on ${w ? w.name : targetId}`,
          `[Summary] ${summary}`
        ],
        `${incId}: ${title}`,
        'logs'
      );
      renderCurrentPage();
      showToast(`Created Incident ${incId}: ${title}`, 'var(--danger)');
    }

    function updateIncidentState(incId, newState) {
      const inc = STATE.incidents.find(x => x.id === incId);
      if (!inc) return;
      inc.status = newState;
      if (newState === 'RESOLVED') {
        const w = STATE.workloads.find(x => x.id === inc.targetId);
        if (w) { w.status = 'RUNNING'; w.cpu = 16.4; }
      }
      autoOpenCliForTask(
        inc.targetId,
        `infrapilot incidents ${newState === 'RESOLVED' ? 'resolve' : 'ack'} ${inc.id}`,
        [
          `[Incident Response] Incident ${inc.id} (${inc.title}) transitioned to ${newState}`,
          newState === 'RESOLVED' ? `✔ Target workload ${inc.service} verified RUNNING and healthy.` : `✔ Assigned to on-call engineer.`
        ],
        `Incident ${inc.id} marked ${newState}`,
        'shell'
      );
      renderCurrentPage();
      showToast(`Incident ${incId} marked as ${newState}`, 'var(--success)');
    }

    function injectChaosFault(scenario) {
      STATE.demoApp.status = 'DEGRADED';
      STATE.demoApp.workerCpu = 98.4;
      STATE.demoApp.errorRate = 0.45;
      const w = STATE.workloads.find(x => x.id === 'res-nexus-worker');
      if (w) { w.cpu = 98.4; w.status = 'DEGRADED'; }

      const incId = `INC-${Math.floor(2000 + Math.random() * 7000)}`;
      STATE.incidents.unshift({
        id: incId,
        title: 'NexusPay Worker CPU Saturation (98.4%) & Queue Deadlock',
        severity: 'CRITICAL',
        status: 'OPEN',
        targetId: 'res-nexus-worker',
        service: 'nexuspay-payment-worker-01',
        summary: `Simulated fault (${scenario}): worker threads deadlocked under high settlement load.`,
        createdAt: 'Just now'
      });
      autoOpenCliForTask(
        'res-nexus-worker',
        `infrapilot demo chaos --scenario ${scenario}`,
        [
          `[Chaos Injector] POST http://127.0.0.1:5055/api/chaos/inject (scenario=${scenario})`,
          `[CRITICAL] nexuspay-payment-worker-01 CPU spiked to 98.4%; HTTP 500 error rate at 45%`,
          `[Alertmanager] Fired P1 Incident ${incId} -> Click "Auto-Heal" to remediate!`
        ],
        `CRITICAL: Chaos fault ${scenario} injected (${incId})`,
        'logs'
      );
      renderCurrentPage();
      showToast(`Simulated Chaos Fault (${incId})`, 'var(--danger)');
    }

    function healAllSystems(openDrawer = true) {
      STATE.demoApp.status = 'HEALTHY';
      STATE.demoApp.connected = true;
      STATE.demoApp.workerCpu = 16.4;
      STATE.demoApp.redisMemMb = 118.0;
      STATE.demoApp.errorRate = 0.0;
      STATE.workloads.forEach(w => {
        w.status = 'RUNNING';
        if (w.id === 'res-nexus-worker') w.cpu = 16.4;
        if (w.id === 'res-nexus-redis') w.memMb = 118;
      });
      STATE.incidents.forEach(i => { i.status = 'RESOLVED'; });
      if (openDrawer) {
        autoOpenCliForTask(
          'res-nexus-worker',
          'infrapilot demo heal',
          [
            '[Closed-Loop Remediation] Dispatching SDK action app_restart_workers -> http://127.0.0.1:5055/api/remediate/heal',
            '[Closed-Loop Remediation] Dispatching Redis cache flush -> memory normalized to 118 MB',
            '✔ All containers RUNNING (CPU 16.4%, Error Rate 0.0%). All open incidents RESOLVED.'
          ],
          'Closed-loop SDK auto-remediation completed',
          'shell'
        );
        showToast('All workloads & incidents auto-healed!', 'var(--success)');
      } else {
        syncNavigationBadges();
      }
      renderCurrentPage();
    }

                <div style="font-size:12px;color:var(--text-muted);">Strip tokens, keys, and credentials before sending logs to Copilot RCA</div>
              </div>
              <button class="toggle-btn ${pol.strict_secret_redaction ? 'on' : ''}" onclick="flipCopilotPolicy('strict_secret_redaction')"></button>
            </div>

            <div class="switch-row">
              <div>
                <div style="font-weight:700;">Automated Pull Request Security Review</div>
                <div style="font-size:12px;color:var(--text-muted);">Scan Terraform, Ansible &amp; Dockerfile PRs prior to Jenkins build</div>
              </div>
              <button class="toggle-btn ${pol.automated_pr_security_review ? 'on' : ''}" onclick="flipCopilotPolicy('automated_pr_security_review')"></button>
            </div>
          </div>
        </div>
      `;
    }

    function runCopilotAnalysis(targetId) {
      STATE.selectedTargetId = targetId;
      const w = STATE.workloads.find(x => x.id === targetId) || STATE.workloads[0];
      if (w.status !== 'RUNNING' || w.cpu > 80) {
        STATE.copilot.lastAnalysis = {
          target: `${w.id} (${w.name})`,
          confidence: '99.1%',
          diagnosis: `CRITICAL ANOMALY: ${w.name} CPU is at ${w.cpu.toFixed(1)}% with thread starvation. Immediate process restart recommended.`,
          recommendedCommand: 'supervisorctl restart all'
        };
      } else {
        STATE.copilot.lastAnalysis = {
          target: `${w.id} (${w.name})`,
          confidence: '98.2%',
          diagnosis: `Analyzed logs for ${w.name}: workload is healthy (CPU ${w.cpu.toFixed(1)}%, Memory ${w.memMb}MB/${w.memLimitMb}MB).`,
          recommendedCommand: 'ps aux && netstat -tulnp'
        };
      }
      autoOpenCliForTask(
        'int-copilot-01',
        `infrapilot copilot analyze ${w.id}`,
        [
          `[GitHub Copilot SRE Agent] Scanning container logs for ${w.name} (${w.id})...`,
          `[Diagnosis (${STATE.copilot.lastAnalysis.confidence})] ${STATE.copilot.lastAnalysis.diagnosis}`,
          `[Suggested Fix] $ ${STATE.copilot.lastAnalysis.recommendedCommand}`
        ],
        `Copilot RCA completed for ${w.name}`,
        'shell'
      );
      renderCurrentPage();
    }

    function flipCopilotPolicy(key) {
      STATE.copilot.policies[key] = !STATE.copilot.policies[key];
      autoOpenCliForTask(
        'int-copilot-01',
        `infrapilot copilot policy --${key.replace(/_/g, '-')} ${STATE.copilot.policies[key] ? 'ENABLED' : 'DISABLED'}`,
        [`[GitHub Copilot Enterprise API] Updated policy ${key} -> ${STATE.copilot.policies[key] ? 'ENABLED' : 'DISABLED'}`],
        `Updated Copilot policy ${key}`,
        'shell'
      );
      renderCurrentPage();
    }

    // 10. USERS & RBAC ACCESS CONTROL PAGE (SUPER ADMIN ONLY)

      const allPerms = [
        { key: 'docker_exec', label: 'Docker Exec & Logs' },

        { key: 'jenkins_admin', label: 'Jenkins Build & Create' },
        { key: 'ansible_run', label: 'Ansible Playbooks' },
        { key: 'terraform_apply', label: 'Terraform Plan/Apply' },
        { key: 'grafana_edit', label: 'Grafana & PromQL' },
        { key: 'prod_approvals', label: 'Prod Gate Approvals' },
        { key: 'rbac_manage', label: 'Super Admin RBAC' }

      const userRows = STATE.rbacUsers.map(u => {
        const chips = allPerms.map(p => {
          const has = u.permissions.includes(p.key);

        }).join('');

        return `
          <tr>
            <td>
              <div style="font-weight:700;color:var(--text-main);">${escapeHtml(u.name)}</div>
              <div class="mono" style="font-size:12px;color:var(--text-muted);">${escapeHtml(u.email)} &bull; ${escapeHtml(u.title)}</div>
            </td>
            <td>
              <select class="select" style="width:155px;padding:5px 8px;font-size:12px;font-weight:700;" onchange="changeUserRoleAssignment('${u.id}', this.value)" ${!isSuper ? 'disabled' : ''}>

                <option value="ADMIN" ${u.role === 'ADMIN' ? 'selected' : ''}>🛡️ ADMIN</option>
                <option value="DEVELOPER" ${u.role === 'DEVELOPER' ? 'selected' : ''}>👨‍💻 DEVELOPER</option>
              </select>
            </td>
            <td>${chips}</td>
          </tr>
        `;
      }).join('');

      return `
        ${!isSuper ? `
          <div class="card" style="margin-bottom:18px;border-color:var(--warning);background:var(--warning-soft);">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
              <div>
                <div style="font-weight:700;font-size:15px;">🔒 Viewing in Read-Only Mode (Current Role: ${STATE.currentRole})</div>
                <div style="font-size:13px;">Only <strong>Super Admin</strong> can grant or revoke developer access and modify role assignments.</div>
              </div>
              <button class="btn btn-primary" onclick="switchUserRole('SUPER_ADMIN')">👑 Switch to Super Admin</button>
            </div>
          </div>
        ` : ''}

        <div class="grid-3">
          <div class="card">
            <div class="card-subtitle">👑 SUPER ADMIN ROLE</div>
            <div class="stat-value">Full Control</div>
            <div style="font-size:12.5px;color:var(--text-secondary);">Unrestricted access to all tools, production approvals, state locks, and granting/revoking Admin &amp; Developer permissions.</div>
          </div>
          <div class="card">
            <div class="card-subtitle">🛡️ ADMIN ROLE</div>
            <div class="stat-value">Ops &amp; Tool Admin</div>
            <div style="font-size:12.5px;color:var(--text-secondary);">Can connect tools, run Ansible/Jenkins/Terraform workflows, and approve deployments, but cannot alter Super Admin RBAC.</div>
          </div>
          <div class="card">
            <div class="card-subtitle">👨‍💻 DEVELOPER ROLE</div>
            <div class="stat-value">Granular Scopes</div>
            <div style="font-size:12.5px;color:var(--text-secondary);">Developers only get access to the exact tools, containers, and actions that the Super Admin toggles on for them below.</div>
          </div>
        </div>

        <div class="card" style="margin-bottom:20px;">
          <div class="card-header">
            <div>
              <div class="card-title">👑 Super Admin: Grant Access to a New Developer or Admin</div>
              <div class="card-subtitle">Add a team member and customize which DevOps tools and container actions they can access</div>
            </div>
          </div>
          <div class="form-grid">
            <div>
              <label class="form-label">Full Name</label>
              <input id="new-usr-name" class="input" placeholder="e.g. Vikram Singh" />
            </div>
            <div>
              <label class="form-label">Email Address</label>
              <input id="new-usr-email" class="input" placeholder="dev-vikram@infrapilot.io" />
            </div>
            <div>
              <label class="form-label">Assign Role</label>
              <select id="new-usr-role" class="select">
                <option value="DEVELOPER">👨‍💻 DEVELOPER (Custom Scopes)</option>
                <option value="ADMIN">🛡️ ADMIN (Ops &amp; Tools)</option>
                <option value="SUPER_ADMIN">👑 SUPER_ADMIN (Full Access)</option>
              </select>
            </div>
            <div>
              <label class="form-label">Team / Job Title</label>

            </div>
            <button class="btn btn-primary" onclick="addNewRbacUser()">+ Grant User Access</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">Granular Developer &amp; Admin Permission Matrix</div>

          </div>
          <div class="table-wrap">
            <table class="clean-table">
              <thead>
                <tr>
                  <th>User &amp; Email</th>
                  <th>Assigned Role</th>
                  <th>Granted Tool &amp; Action Permissions (Click to Toggle)</th>
                </tr>
              </thead>
              <tbody>
                ${userRows}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // 11. LIVE LOGS & INTERACTIVE CLI CONSOLE PAGE
    function renderConsolePage() {
      const w = STATE.workloads.find(x => x.id === STATE.selectedTargetId) || STATE.workloads[0];
      const logs = (STATE.logsByTarget[STATE.selectedTargetId] || []).filter(l => {
        if (STATE.logLevelFilter !== 'ALL' && l.level !== STATE.logLevelFilter) return false;
        if (STATE.logSearchQuery && !(`${l.msg} ${l.src}`.toLowerCase().includes(STATE.logSearchQuery.toLowerCase()))) return false;
        return true;
      });

      return `
        <div class="grid-2">
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">💻 Interactive Container / Pod Shell (cmd / PowerShell / bash)</div>
                <div class="card-subtitle">Run commands directly inside any selected container or microservice</div>
              </div>
              <div style="display:flex;gap:8px;">
                <select class="select" style="width:190px;padding:5px 8px;font-size:12px;" onchange="selectTarget(this.value)">
                  ${STATE.workloads.map(x => `<option value="${x.id}" ${x.id === STATE.selectedTargetId ? 'selected' : ''}>${escapeHtml(x.name)}</option>`).join('')}
                </select>
                <select class="select" style="width:120px;padding:5px 8px;font-size:12px;" onchange="changeShellType(this.value)">
                  <option value="bash" ${STATE.shellType === 'bash' ? 'selected' : ''}>bash</option>
                  <option value="pwsh" ${STATE.shellType === 'pwsh' ? 'selected' : ''}>PowerShell</option>
                  <option value="cmd" ${STATE.shellType === 'cmd' ? 'selected' : ''}>cmd.exe</option>
                  <option value="sh" ${STATE.shellType === 'sh' ? 'selected' : ''}>sh</option>
                </select>
              </div>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
              <button class="btn btn-sm" onclick="executeShellCommand('${w.id}', 'ps aux')">ps aux</button>
              <button class="btn btn-sm" onclick="executeShellCommand('${w.id}', 'env')">env</button>
              <button class="btn btn-sm" onclick="executeShellCommand('${w.id}', 'netstat -tulnp')">netstat -tulnp</button>
              <button class="btn btn-sm" onclick="executeShellCommand('${w.id}', 'df -h && free -m')">df -h &amp;&amp; free -m</button>
              <button class="btn btn-sm btn-success" onclick="executeShellCommand('${w.id}', 'redis-cli FLUSHALL')">redis-cli FLUSHALL</button>
              <button class="btn btn-sm btn-success" onclick="executeShellCommand('${w.id}', 'supervisorctl restart all')">supervisorctl restart</button>
            </div>

            <div class="mono" style="background:var(--bg-terminal);color:#e2e8f0;padding:14px;border-radius:10px;height:280px;overflow-y:auto;font-size:12.5px;line-height:1.55;white-space:pre-wrap;margin-bottom:10px;">${escapeHtml(STATE.shellHistory.join('\n\n'))}</div>

            <div style="display:flex;gap:8px;">
              <input
                id="page-shell-input"
                class="input mono"
                placeholder="Type command for ${escapeHtml(w.name)} (e.g. ps aux, env, netstat -tulnp)..."
                onkeydown="if(event.key==='Enter'){ executeShellCommand('${w.id}', this.value); this.value=''; }"
              />
              <button class="btn btn-primary" onclick="const el=document.getElementById('page-shell-input'); executeShellCommand('${w.id}', el.value); el.value='';">Execute</button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">📜 Live Container &amp; Tool Logs</div>
                <div class="card-subtitle">Select any container or any of the 10 connected DevOps tools to inspect its live logs</div>
              </div>
              <div style="display:flex;gap:6px;">
                <select class="select" style="width:190px;padding:5px 8px;font-size:12px;" onchange="selectTarget(this.value)">
                  <optgroup label="Containers &amp; Workloads">
                    ${STATE.workloads.map(x => `<option value="${x.id}" ${x.id === STATE.selectedTargetId ? 'selected' : ''}>📦 ${escapeHtml(x.name)}</option>`).join('')}
                  </optgroup>
                  <optgroup label="Connected DevOps Tools">
                    ${STATE.tools.map(t => `<option value="${t.id}" ${t.id === STATE.selectedTargetId ? 'selected' : ''}>🔌 ${escapeHtml(t.name)}</option>`).join('')}
                  </optgroup>
                </select>
                <select class="select" style="width:100px;padding:5px 8px;font-size:12px;" onchange="STATE.logLevelFilter=this.value; renderCurrentPage();">
                  <option value="ALL" ${STATE.logLevelFilter === 'ALL' ? 'selected' : ''}>ALL</option>
                  <option value="INFO" ${STATE.logLevelFilter === 'INFO' ? 'selected' : ''}>INFO</option>
                  <option value="WARN" ${STATE.logLevelFilter === 'WARN' ? 'selected' : ''}>WARN</option>
                  <option value="ERROR" ${STATE.logLevelFilter === 'ERROR' ? 'selected' : ''}>ERROR</option>
                </select>
              </div>
            </div>

            <div style="display:flex;gap:8px;margin-bottom:10px;">
              <input
                class="input"
                placeholder="Search / filter log lines..."
                value="${escapeHtml(STATE.logSearchQuery)}"
                oninput="STATE.logSearchQuery=this.value; renderCurrentPage();"
              />
              <button class="btn btn-sm" onclick="addLogEntry('${STATE.selectedTargetId}', 'INFO', 'operator.probe', 'Manual log check OK'); renderCurrentPage();">+ Test Log</button>
            </div>

            <div class="mono" style="background:var(--bg-terminal);color:#cbd5e1;padding:14px;border-radius:10px;height:325px;overflow-y:auto;font-size:12px;line-height:1.6;">
              ${logs.map(l => `<div><span style="color:#64748b;">${escapeHtml(l.ts)}</span> <strong style="color:${l.level === 'ERROR' ? '#f87171' : (l.level === 'WARN' ? '#fbbf24' : '#34d399')};">[${escapeHtml(l.level)}]</strong> <span style="color:#38bdf8;">[${escapeHtml(l.src)}]</span> ${escapeHtml(l.msg)}</div>`).join('') || '<div style="color:#64748b;">No matching log entries.</div>'}
            </div>
          </div>
        </div>
      `;
    }

            { cmd: 'infrapilot users grant "dev-rahul@infrapilot.io" --role DEVELOPER --permissions "docker,kubernetes,jenkins,grafana,logs,exec"', info: '[Super Admin] Grant role and tool permissions to a developer' }

      const sdkCode = `from infrapilot import InfraPilotToolAgent, ToolActionResult

    return ToolActionResult(success=True, action="app_restart_workers", message="Workers restarted")

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      syncNavigationBadges();

      renderDrawerOutput();

  </script>
