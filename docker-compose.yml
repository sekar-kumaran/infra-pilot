version: "3.9"

services:
  infrapilot_docker_proxy:
    image: alpine/socat:latest
    container_name: infrapilot_docker_proxy
    command: TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    restart: always

  infrapilot-api:
    build: .
    container_name: infrapilot-api
    environment:
      - INFRAPILOT_DB_PATH=/tmp/infrapilot_state.db
      - DOCKER_HOST=http://infrapilot_docker_proxy:2375
    ports:
      - "8000:8000"
    depends_on:
      - infrapilot_docker_proxy
    restart: always

  infrapilot-web:
    image: sekarkumaran461/infrapilot-web:latest
    container_name: infrapilot-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "8090:3000"
    depends_on:
      - infrapilot-api
    restart: always
