services:
  postgres:
    image: postgres:15-alpine
    container_name: infrapilot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: infrapilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run once on first DB initialization
      - ./postgres-initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infrapilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: infrapilot-api:latest
    container_name: infrapilot_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=True
      - LOG_LEVEL=DEBUG
      - CORS_ALLOWED_ORIGINS=*
      # Uses psycopg2 dialect — stable across all environments
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/infrapilot
      - AUTH_SECRET_KEY=super-secret-key-for-local-dev-only-change-in-prod
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      - INTEGRATION_ENCRYPTION_KEY=WN615IJG5YQv4_X-845VnvfLA6k8Vw-q7yZX-EaFE_o=
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: infrapilot_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: infrapilot-api:latest
    container_name: infrapilot_celery_worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    environment:
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/infrapilot
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      - INTEGRATION_ENCRYPTION_KEY=WN615IJG5YQv4_X-845VnvfLA6k8Vw-q7yZX-EaFE_o=
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
