###############################################################################
# NAGIOS CHECK COMMAND DEFINITIONS
###############################################################################

define command {
    command_name    check_http_url
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e 200
}

define command {
    command_name    check_http_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -s "UP"
}

define command {
    command_name    check_http_latency
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -w 0.5 -c 2.0
}
