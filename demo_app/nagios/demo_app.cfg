###############################################################################
# NAGIOS CONFIGURATION: CloudPulse 4-Page Demo Application
###############################################################################

# Host Definition for CloudPulse Application Server
define host {
    use                     linux-server
    host_name               CloudPulse-App-Server
    alias                   CloudPulse 4-Page Enterprise Workload
    address                 127.0.0.1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# Service 1: Page 1 - Dashboard / Overview
define service {
    use                     generic-service
    host_name               CloudPulse-App-Server
    service_description     Page 1 - Overview Dashboard
    check_command           check_http_url!5050!/
    check_interval          1
    retry_interval          1
    notification_interval   15
}

# Service 2: Page 2 - Microservices Catalog
define service {
    use                     generic-service
    host_name               CloudPulse-App-Server
    service_description     Page 2 - Services Catalog
    check_command           check_http_url!5050!/services
    check_interval          1
    retry_interval          1
    notification_interval   15
}

# Service 3: Page 3 - Telemetry & Analytics
define service {
    use                     generic-service
    host_name               CloudPulse-App-Server
    service_description     Page 3 - Telemetry Observability
    check_command           check_http_url!5050!/analytics
    check_interval          1
    retry_interval          1
    notification_interval   15
}

# Service 4: Page 4 - Admin Operations
define service {
    use                     generic-service
    host_name               CloudPulse-App-Server
    service_description     Page 4 - Admin Operations
    check_command           check_http_url!5050!/admin
    check_interval          1
    retry_interval          1
    notification_interval   15
}

# Service 5: REST API /health Endpoint
define service {
    use                     generic-service
    host_name               CloudPulse-App-Server
    service_description     Health Check Endpoint
    check_command           check_http_health!5050!/health
    check_interval          1
    retry_interval          1
    notification_interval   15
}
