[cloudpulse_app]
cloudpulse-node-01 ansible_host=127.0.0.1 ansible_port=5050 role=primary_app env=production
cloudpulse-node-02 ansible_host=127.0.0.1 ansible_port=5051 role=auth_service env=production
cloudpulse-node-03 ansible_host=127.0.0.1 ansible_port=5052 role=order_engine env=production
cloudpulse-node-04 ansible_host=127.0.0.1 ansible_port=5053 role=payment_worker env=production

[monitoring_hosts]
nagios-core-server ansible_host=127.0.0.1 nagios_port=8085 role=monitoring_core

[cloudpulse_cluster:children]
cloudpulse_app
monitoring_hosts

[cloudpulse_cluster:vars]
ansible_connection=local
ansible_python_interpreter=python
app_name=CloudPulse Demo Application
app_version=1.0.0
infrapilot_integration=enabled
