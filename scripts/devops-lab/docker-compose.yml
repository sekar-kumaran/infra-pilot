version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpassword
      POSTGRES_DB: labdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d labdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lab_net

  backend:
    build: 
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://labuser:labpassword@db:5432/labdb
    networks:
      - lab_net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - lab_net

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - lab_net

  ansible-target:
    image: ubuntu:22.04
    command: >
      bash -c "apt-get update && apt-get install -y openssh-server python3 sudo &&
      mkdir /var/run/sshd && echo 'root:root' | chpasswd &&
      sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config &&
      /usr/sbin/sshd -D"
    ports:
      - "2222:22"
    networks:
      - lab_net

  traffic:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: ["python", "traffic.py"]
    depends_on:
      - backend
    networks:
      - lab_net

networks:
  lab_net:
    driver: bridge
