# Crash-Proof Nginx Reverse Proxy Configuration for NearMart + InfraPilot
# Uses Docker embedded DNS (127.0.0.11) with runtime variable resolution so Nginx
# NEVER crashes with `[emerg] host not found in upstream "infrapilot_api"` if containers boot asynchronously.

server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /infrapilot/api/ {
        set $infrapilot_api_upstream http://infrapilot-api:8000;
        rewrite ^/infrapilot/api/(.*)$ /api/v1/$1 break;
        proxy_pass $infrapilot_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
